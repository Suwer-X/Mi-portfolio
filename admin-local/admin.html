<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Administrador del portfolio (local)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1e3f'/%3E%3Cpath d='M9 16h14M16 9v14' stroke='%2338bdf8' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="admin.css" />
  <script>
    /* Protección frente a la recarga automática de Live Server (y herramientas similares):
       cuando el administrador está escribiendo en la carpeta, un mensaje «reload» del servidor de desarrollo
       interrumpiría la publicación a medias. Mientras `__reloadGuard.busy` es true se ignora la recarga. */
    (function () {
      var guard = window.__reloadGuard = { busy: false, deferred: 0 };
      var Native = window.WebSocket; if (!Native) return;
      function Guarded(url, protocols) {
        var ws = protocols === undefined ? new Native(url) : new Native(url, protocols);
        if (/\/ws$/.test(String(url))) {
          var handler = null;
          Native.prototype.addEventListener.call(ws, 'message', function (ev) {
            if (!handler) return;
            if (guard.busy && ev.data === 'reload') { guard.deferred++; return; }
            handler.call(ws, ev);
          });
          Object.defineProperty(ws, 'onmessage', { configurable: true, get: function () { return handler; }, set: function (fn) { handler = fn; } });
        }
        return ws;
      }
      Guarded.prototype = Native.prototype;
      ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'].forEach(function (k) { Guarded[k] = Native[k]; });
      window.WebSocket = Guarded;
    })();
  </script>
</head>
<body>
  <header class="top">
    <div>
      <h1>Administrador del portfolio</h1>
      <p class="sub">Herramienta local · no forma parte de la web pública</p>
    </div>
    <div class="top-actions">
      <button class="btn" id="btnNew" type="button">+ Nuevo proyecto</button>
      <button class="btn" id="btnBackup" type="button">Copia de seguridad</button>
      <button class="btn" id="btnExport" type="button">Exportar ZIP</button>
    </div>
  </header>

  <section class="statusbar" id="statusbar" aria-label="Estado de la carpeta del portfolio"></section>

  <div id="banners"></div>

  <div class="layout">
    <aside class="side" aria-label="Lista de proyectos">
      <input class="input" id="search" type="search" placeholder="Buscar proyectos…" aria-label="Buscar proyectos" />
      <div class="filters" id="filters" role="tablist" aria-label="Filtro por estado">
        <button type="button" data-filter="all" class="is-on">Todos</button>
        <button type="button" data-filter="draft">Borradores</button>
        <button type="button" data-filter="published">Publicados</button>
      </div>
      <p class="count" id="count"></p>
      <ul class="plist" id="list"></ul>
    </aside>

    <main class="main" id="editor" aria-live="polite"></main>
  </div>

  <dialog id="dlg"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="admin.js"></script>
</body>
</html>
